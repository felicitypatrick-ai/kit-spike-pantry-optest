          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess, sys
          data = json.loads(gzip.decompress(base64.b64decode(open("/tmp/kit.b64").read().replace(" ", "").replace("\n", ""))))
          step, who = os.environ["STEP"], os.environ["WHO"]
          n = str(int(hashlib.sha256(who.lower().encode()).hexdigest(), 16) % 12 + 1)
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          def say(t): print(t); out.write(t + "\n\n")
          def git(*a): subprocess.run(["git", *a], check=True)
          def write(p, t):
              os.makedirs(os.path.dirname(p) or ".", exist_ok=True); open(p, "w").write(t)
          def change(items):
              for p, old, new in items:
                  if old is None:
                      write(p, new); continue
                  t = open(p).read() if os.path.exists(p) else ""
                  if old not in t:
                      say(f"Stop: the kit could not update {p}, because that file is not as the starter left it. Ask your instructor.")
                      sys.exit(1)
                  write(p, t.replace(old, new, 1))
          if step == "start":
              if os.path.exists("course/card.json"):
                  say("Your starter app is already here. Nothing changed."); sys.exit(0)
              d = data[os.environ.get("APP") or "pantry"]; k = d["k"][n]
              for p, t in d["f"].items(): write(p, t)
              write("course/card.json", k["c"]); change(k["s"])
              git("add", "-A"); git("commit", "-q", "-m", "Add the starter app and team card"); git("push", "-q", "origin", "HEAD:main")
              say(f"Done: the starter app and your team card (card {n}) are on main. Open course/card.json to read your team's facts.")
              sys.exit(0)
          card = json.load(open("course/card.json")) if os.path.exists("course/card.json") else None
          if not card:
              say("Stop: run the start step first."); sys.exit(1)
          name = next(a for a in data if all(os.path.exists(p) for p in data[a]["f"] if p.startswith("app/")))
          k = data[name]["k"][n]
          if step == "team-update":
              git("checkout", "-q", "-b", "team-update")
              for p, t in data[name]["n"].items(): write(p, t)
              change(k["u"])
              git("add", "-A"); git("commit", "-q", "-m", "Add the team's update: pickup reminders"); git("push", "-q", "-f", "origin", "team-update")
              say("Done: the team's update is on branch team-update. Open a pull request from team-update into main to start its checks.")
          elif step == "releases":
              base = "main"
              for v, items in k["r"]:
                  git("checkout", "-q", base); git("checkout", "-q", "-B", f"release-{v}"); base = f"release-{v}"
                  change(items)
                  git("add", "-A"); git("commit", "-q", "-m", f"Release {v}"); git("push", "-q", "-f", "origin", f"release-{v}")
              say("Done: branches release-1.1, release-1.2 and release-1.3 are ready. Send each one in order: open its pull request into main and merge it.")
          PY
